<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ heading }} · Film Catalog</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body { min-height: 100vh; }
		.navbar-brand { letter-spacing: .02em; }
		.card { border-color: var(--bs-border-color); }
		.table > :not(caption) > * > * { padding: .65rem .85rem; }
		.table thead th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--bs-secondary-color); }
		.desc-cell { max-width: 28rem; }
		.example-chip { cursor: pointer; }
	</style>
</head>
<body>
	{% set path = request.path %}
	<nav class="navbar navbar-expand-md bg-body-tertiary border-bottom">
		<div class="container">
			<a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">🎬 Film Catalog</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="nav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link {{ 'active' if path == '/' }}" href="{{ url_for('index') }}">Home</a></li>
					<li class="nav-item"><a class="nav-link {{ 'active' if path.startswith('/films') }}" href="{{ url_for('films_index') }}">Films</a></li>
					<li class="nav-item"><a class="nav-link {{ 'active' if path.startswith('/actors') }}" href="{{ url_for('actors_index') }}">Actors</a></li>
					<li class="nav-item"><a class="nav-link {{ 'active' if path.startswith('/categories') }}" href="{{ url_for('categories_index') }}">Categories</a></li>
					<li class="nav-item"><a class="nav-link {{ 'active' if path.startswith('/languages') }}" href="{{ url_for('languages_index') }}">Languages</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="container py-4">
		{% with messages = get_flashed_messages(with_categories=true) %}
			{% for category, message in messages %}
				<div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show" role="alert">
					{{ message }}
					<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
				</div>
			{% endfor %}
		{% endwith %}

		<h1 class="h3 mb-4">{{ heading }}</h1>
		{% block body %}{% endblock %}
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		// Ask before submitting any form that has a data-confirm message
		document.addEventListener('submit', function (e) {
			var message = e.target.dataset.confirm;
			if (message && !confirm(message)) e.preventDefault();
		});
		// Live filter for tables: <input data-filter-table="#table-id">
		document.querySelectorAll('[data-filter-table]').forEach(function (input) {
			input.addEventListener('input', function () {
				var needle = input.value.toLowerCase();
				document.querySelectorAll(input.dataset.filterTable + ' tbody tr').forEach(function (row) {
					row.hidden = !row.textContent.toLowerCase().includes(needle);
				});
			});
		});
	</script>
</body>
</html>
