{% extends "base.html" %}
{% from "_macros.html" import post_button %}
{% block body %}
	{% for id, name, last_update in language %}
		<div class="card mb-3">
			<div class="card-body">
				<dl class="row mb-0">
					<dt class="col-sm-3">Name</dt><dd class="col-sm-9">{{ name }}</dd>
					<dt class="col-sm-3">Last update</dt><dd class="col-sm-9 mb-0">{{ last_update }} UTC</dd>
				</dl>
			</div>
		</div>
		<div class="d-flex gap-2">
			{{ post_button(update_language_link, id, 'Edit', 'warning') }}
			<a class="btn btn-outline-secondary" href="{{ index_language_link }}">Back</a>
		</div>
	{% endfor %}
{% endblock %}
